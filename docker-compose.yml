version: "3.9"

# ---------------------------------------------------------------------------- #
# Services
# ---------------------------------------------------------------------------- #

services:

  # ------------------------------------------------------------------------ #
  # PHP-FPM application
  # ------------------------------------------------------------------------ #

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app

  # ------------------------------------------------------------------------ #
  # Nginx web server
  # ------------------------------------------------------------------------ #

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app

  # ------------------------------------------------------------------------ #
  # MySQL database
  # ------------------------------------------------------------------------ #

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app

  # ------------------------------------------------------------------------ #
  # phpMyAdmin database management
  # ------------------------------------------------------------------------ #

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "18080:80"
    environment:
      PMA_HOST: ${DB_HOST:-mysql}
      PMA_PORT: ${DB_PORT:-3306}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app

# ---------------------------------------------------------------------------- #
# Volumes
# ---------------------------------------------------------------------------- #

volumes:
  mysql_data:
  vendor_data:
  node_modules_data:

# ---------------------------------------------------------------------------- #
# Networks
# ---------------------------------------------------------------------------- #

networks:
  app:
    driver: bridge
