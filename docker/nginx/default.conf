server {

    listen 80;

    server_name _;

    root /var/www/html/public;

    index index.php index.html;

    charset utf-8;


    client_max_body_size 50M;


    # Security headers

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;


    # Hidden files

    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }


    # Prevent PHP execution in sensitive folders

    location ~ ^/(storage|vendor|bootstrap/cache)/.*\.php$ {
        deny all;
        return 404;
    }


    # Static files

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|eot)$ {

        expires 30d;

        add_header Cache-Control "public, immutable";

        try_files $uri =404;

    }


    # Laravel

    location / {

        try_files $uri $uri/ /index.php?$query_string;

    }


    # Health check

    location = /up {

        access_log off;

        return 200 "OK";

    }


    # PHP-FPM

    location ~ \.php$ {

        fastcgi_pass app:9000;

        fastcgi_index index.php;

        include fastcgi.conf;

    }


    # Deny other files

    location ~* \.(env|log|sql|bak)$ {

        deny all;

        return 404;

    }


    # Gzip

    gzip on;

    gzip_vary on;

    gzip_proxied any;

    gzip_comp_level 6;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;
}
